name: Fix PR 169 review feedback

on:
  push:
    branches:
      - automation/pr-169-fix

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-pr-169
  cancel-in-progress: true

jobs:
  fix:
    if: github.repository == 'Microck/kagi-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout contributor branch
        uses: actions/checkout@v7.0.0
        with:
          ref: automation/pr-169-fix
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Merge current upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Microck/kagi-cli.git 2>/dev/null || true
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicts" && "$conflicts" != "CHANGELOG.md" ]]; then
            printf 'Unexpected merge conflicts:\n%s\n' "$conflicts" >&2
            exit 1
          fi
          if [[ $merge_status -ne 0 && -z "$conflicts" ]]; then
            echo "Merge failed without a resolvable conflict" >&2
            exit 1
          fi

      - name: Apply review fixes
        run: python3 .github/scripts/fix_pr_169.py

      - name: Verify merge resolution
        shell: bash
        run: |
          set -euo pipefail
          git add CHANGELOG.md docs/commands/mcp.mdx src/main.rs tests/integration-cli.rs
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicts" ]]; then
            printf 'Unresolved merge conflicts:\n%s\n' "$conflicts" >&2
            exit 1
          fi
          git diff --check

      - name: Format
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_pr_169.py .github/workflows/fix-pr-169.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address MCP protocol review feedback"
          git push origin HEAD:automation/pr-169-fix

      - name: Report repair failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/170/comments" \
            -f body="PR 169 repair automation failed: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
