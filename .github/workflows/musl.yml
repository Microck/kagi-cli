name: Static Linux builds
'on':
  push:
    branches:
    - '**'
  pull_request: null
permissions:
  contents: read
concurrency:
  group: musl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Install musl toolchain
      run: 'sudo apt-get update

        sudo apt-get install -y musl-tools binutils

        '
    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
    - name: Build static musl release binary
      env:
        CC: musl-gcc
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        RUSTFLAGS: -C target-feature=+crt-static
      run: cargo build --locked --release --target ${{ matrix.target }}
    - name: Verify static musl release binary
      env:
        TARGET: ${{ matrix.target }}
      run: "set -euo pipefail\nbinary=\"target/$TARGET/release/kagi\"\nreadelf --program-headers\
        \ \"$binary\" > program-headers.txt\nreadelf --dynamic \"$binary\" > dynamic-section.txt\n\
        if grep -q 'INTERP' program-headers.txt || grep -q '(NEEDED)' dynamic-section.txt;\
        \ then\n  echo \"Expected a static musl binary without a dynamic loader or\
        \ shared libraries\" >&2\n  exit 1\nfi\n\"$binary\" --version\n\"$binary\"\
        \ --help\n"
