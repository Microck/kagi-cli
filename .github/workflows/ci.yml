name: Apply PR 169 review fixes

on:
  push:
    branches:
      - automation/pr-169-fix
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-169-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'automation/pr-169-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7.0.0
        with:
          ref: automation/pr-169-fix
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Apply readable review fixes
        run: python3 .github/scripts/fix_pr_169.py

      - name: Format
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Commit validated fixes and restore CI
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/fix-pr-169.yml .github/scripts/fix_pr_169.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address MCP protocol review feedback"
          git push origin HEAD:automation/pr-169-fix
